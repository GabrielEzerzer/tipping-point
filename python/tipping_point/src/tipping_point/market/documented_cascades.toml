# Liquidation cascades documented inside the label span (#29, research pass section 3, validation
# (b)). cascade.recall reads this list. Nothing is to be tuned on it: all but the first event lie in
# the confirmatory span. Days are UTC and inclusive.
#
# Garcia Seuma (2026, https://arxiv.org/abs/2607.27070), the first source of the last five, dates
# only October 2025 to the minute. It names the others by month, and takes each onset from "the
# documented crash day" without saying which day that is, so 2024-12, 2025-02 and 2025-04 span the
# whole month they name, and the rule firing anywhere in it counts as recalling them. The other
# sources are press reports of liquidations in that month; those days are in the notes, and they
# are not the list's dates.

[[event]]
name = "2023-08-17"
first_day = 2023-08-17
last_day = 2023-08-17
note = "In the pilot year. In Binance's own files BTC falls 10.0 % in the bar from 21:40 UTC and open interest 8.0 % by the 21:45 stamp (log changes -0.106 and -0.084); #23's cruder detector found it first."
sources = [
    "https://decrypt.co/152872/bitcoin-ethereum-flash-crash-triggers-800-million-liquidations",
    "https://cointelegraph.com/news/bitcoin-ether-price-slump-crypto-bloodbath-1-b-liquidations",
    "https://github.com/GabrielEzerzer/tipping-point/issues/23",
]

