[project]
name = "tipping-point"
version = "0.1.0"
description = "Tipping Point models (JEPA world model and friends)."
requires-python = ">=3.13"
license = "MIT"
dependencies = ["numpy>=2.5.4", "pyarrow>=26.0.0"]

# PyTorch comes in one build per machine: `uv sync --extra cpu` here, `--extra cu126` on a CUDA box.
[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cu126 = ["torch==2.14.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatch_build.py stamps the commit a build comes from into tipping_point/_build_info.py (#109)
[tool.hatch.build.hooks.custom]
