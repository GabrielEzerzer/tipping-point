[data]
domain = "market-latent"
symbols = ["BTCUSDT", "ETHUSDT"]   # both: each symbol's model reads both symbols
missing = "a minute whose latent or surprise is not finite in any table read on that symbol (a feature gap in the minute, or no valid minute in the predictor's context) has no value; a segment holding such a minute, or one the baseline excludes on that symbol, is excluded for every column, indicator and checkpoint, latent and classic alike, and counted, so that every comparison is paired on the same segments"

[data.labels]            # the baseline's labels, which the freeze holds equal
tag = "prereg/market-labels-v1"
sha256 = "d5988eab9e1bab7442e8d56dd7d80388d1696a6cb0ef6d6b4d4bb50f26507458"

[data.events]
primary = "regime-shifts"
stress = "cascades"

# The frozen classic test whose segments this file is scored on. Neither file is scored on
# confirmatory data before both are frozen (#30 choice 10).
[baseline]
tag = "prereg/market-ews-v1"
sha256 = "58033688a77391156ad0bfbbef31486060076c91e42eacd9f05f2c223ce4ddd9"

# The primaries (harness/m8_primaries.py): one model per symbol, each trained on its own symbol's
# 1-second book features; the twin of each is its step-0 checkpoint.
[training]
span = { start = 2023-01-18, end = 2023-08-31 }
validation = { start = 2023-09-01, end = 2023-09-30 }
features = ["ret", "rv100", "moves", "micro_dev", "imb_1", "imb_5", "imb_20", "ofi", "depth_5", "depth_20", "depth_asym", "slope_b", "slope_a", "wide"]
feature_format = 4       # book.features.FORMAT 4: second 0 seeded from the previous day's book (#170)
scaling = "each model's features are scaled by the record fitted on its own symbol's training days (jepa.days); a model reading the other symbol takes that symbol's record, fitted on its training days, never refitted on what is read"
size = "S"
dim = 64
steps = 10000
primaries = [101, 102, 103, 104, 105]
spares = [106, 107]
replacement = "A primary is replaced by the next spare of its symbol, 106 and then 107, only when its training fails train.verify or the extraction refuses its checkpoint (unreadable, a sha256 that differs from its pin, or collapsed). The replacement is logged in deviations before any scored result is read, and a primary is never replaced for its scores. No replacement has happened: all 14 trainings ran to 10,000 steps at their first attempt, none records a collapse, all pass train.verify, and each checkpoint's sha256 values were recomputed from its files and equal its pin."
refusals = "jepa.days refuses any day from 2024-01-01 as a training input, and any feature file whose metadata names another symbol, day, feature format or feature list; a checkpoint is pinned only from a complete training of the primaries' configuration whose every day read is its data manifest's file"

# What a checkpoint's latent table holds, and the columns the pairs read; pc_2..pc_8 and surprise5
# are extracted but judged by nothing. The entries are pins.json's, value for value.
[latents]
columns = ["pc_1", "surprise"]
context = 96             # minutes a predictor chunk holds: the readout sees the 95 before minute m
series = "per UTC minute m of the read symbol and per checkpoint, trained and twin alike: surprise, the error of the delta = 1 prediction of z_m from the context - 1 minutes before it, and pc_1 to pc_8, z_m on the PCA basis saved with that checkpoint, z_m being the target encoder's latent of minute m; read as two contiguous series, one over [seasonality]'s fit span and one from 5 x the largest horizon + window + length - 1 + context - 1 minutes before 2024-01-01 (514 minutes at horizons up to 24 bars, window 60, length 240 and context 96) to the end of the labels' confirmatory span, so that the first minute of a segment ending at the earliest confirmatory onset has its full context; each value known when minute m closes, and deseasonalised as [seasonality] says, with a slot profile fitted per column, checkpoint and read symbol over its fit span"
pca = "each checkpoint's own basis, saved with it by the trainer (final.pt for the trained model, the step-0 checkpoint for its twin): 8 components fitted on 4,096 valid minutes of its training days drawn with replacement under the run's pca seed stream"

