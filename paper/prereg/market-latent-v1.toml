# Pre-registration: the market JEPA's latent warning test (#30 M9). Written from
# TEMPLATE-market-latent.toml after the M6 exploratory latent passes on 2023-Q4 and the M8 trainings;
# [disclosure] says what was seen and when. Units as in market-ews-v1.

id = "market-latent"
version = 1
supersedes = ""
reason = ""
question = "Over the four hours before a regime-shift onset in the BTC and ETH perpetuals, is the trend (Kendall's tau) of latent indicators from a JEPA trained on Bybit order books further from their trends over matched calm windows, in either direction, read on the model's own asset and across assets, and beyond the model's untrained twin and the classic indicators?"

# One per judged pair (the four pairs only, 2026-11-09), each two-sided: the trend score's AUC is
# read as its distance from 0.5. The prediction states the decision rule; h = 5 and 6 are decisive.

[[hypotheses]]
name = "pc1-variance"
column = "pc_1"
indicator = "variance"
statement = "The trend (Kendall's tau) of the rolling variance of the leading latent component over the four hours before a regime-shift onset lies further from its trends over matched calm windows than chance gives, in either direction."
prediction = "Decisive at h = 5 and 6; h = 12 and 24 are scored, counted and reported, not decisive. A CI lies above a value when its lower end does. The CI is the percentile bootstrap interval of the scoring.bootstrap draws, and every percentile here, the shift's 95th, the combined margin's interval and the latent-minus-classic 97.5th included, uses numpy's linear interpolation (scoring.percentile_interval, np.nanquantile). The units read are the four judged cells, each holding the five primaries of its model's symbol, and, per model symbol, its five primaries' pooled groups, formed as cells.groups says. A primary's pooled AUC is that of both read symbols' events against both read symbols' controls, read by that checkpoint. The pooled shift null moves each read symbol's onsets within its own eligible bars in each draw, and takes the 95th percentile of the pooled |AUC - 0.5| over the draws. (1) Warns: in every unit, every primary's trained AUC 95 % CI excludes 0.5, all five on the same side of 0.5, and its |AUC - 0.5| lies above the 95th percentile of the same statistic over the event-time shift's draws, the two-sided counterpart, on a statistic folded about 0.5, of market-ews-v1's one-sided 97.5th percentile. (2) Learned: in every unit, the five primaries' trained-minus-twin margins, combined as scoring.twin.seeds says, pass under the tolerance rule, and every primary's margin carries the sign of the combined margin. (3) Beyond classic: in every unit, every primary's latent-minus-classic difference passes as scoring.classic.pairing says, against the classic indicator scoring.classic.against matches to the pair. Tolerance rule, with scoring.twin.tolerance 0.02 in |AUC - 0.5|: a combined margin passes when its 95 % CI's lower end is above 0.02; it fails when its CI's upper end is below 0.02, which covers both no margin of that size and a twin that reads better; otherwise it is inconclusive. The pair warns only when (1) holds at both h = 5 and h = 6. (2) and (3) are read, and claimed, only for a pair that warns, and each holds only when it holds at both h = 5 and h = 6; for a pair that does not warn they are reported with no verdict. A unit that is inconclusive does not pass, and every unit's outcome is reported."
direction = "two-sided"

