# Restated from the baseline and held equal to it by the freeze.
[indicators]
pairs = [["pc_1", "variance"], ["pc_1", "ac"], ["surprise", "variance"], ["surprise", "level"]]
window = 60
length = 240
lag = 1
detrend = "none"

[seasonality]
method = "mean"
fit = { start = 2023-01-18, end = 2023-09-30 }
strata = ["onset-hour"]

[segments]
horizons = [5, 6, 12, 24]
rule = "an event segment at horizon h bars ends with the minute that closes at the onset minus 5h minutes and holds the window + length - 1 minutes up to it; the length is the same at every horizon, a segment may start before the labels' clean window, and the share of its minutes in bars with H = 1 is reported"
controls = "control segments are the non-overlapping runs of window + length - 1 minutes cut in time order from the start of each null stretch of the labels run, one set for every horizon; with subsample n > 0, at most n of each symbol's are kept, drawn without replacement under the seed after the exclusions when there are more"
subsample = 0
seed = 30

# [model's symbol, read symbol]: each model reads both symbols, each with that symbol's own scaling.
[cells]
read = [["BTCUSDT", "BTCUSDT"], ["BTCUSDT", "ETHUSDT"], ["ETHUSDT", "BTCUSDT"], ["ETHUSDT", "ETHUSDT"]]
judged = "all"
groups = "each primary checkpoint, trained and twin, is scored per [model's symbol, read symbol] cell (per-asset) and, with eth-only, per cell reading ETHUSDT; with judged 'all' each model's pooled group holds its two cells, and with judged 'same-asset' one pooled group per primary seed holds only that seed's BTCUSDT on BTCUSDT and ETHUSDT on ETHUSDT cells; the hypotheses read the judged cells and these pooled groups, and the other cells are reported; the classic AUCs are taken pooled over both symbols, per read symbol and on the eth-only segments"

[scoring]
statistic = "|AUC - 0.5|"
ci_level = 0.95
bootstrap = 2000
seed = 30

[scoring.shift]          # the latent's primary null: does it warn at all
draws = 100
min_offset_bars = 288

[scoring.surrogates]
secondary = "phase"
n = 999

[scoring.twin]           # did training matter
pairing = "trained minus twin of |AUC - 0.5|, same model seed, same read symbol, same segments and the same bootstrap draws; a judged cell or pooled group passes only when every primary's trained AUC - 0.5 has the same sign, so that seeds warning in opposite directions never pass on their margins"
seeds = "a percentile bootstrap over the 5 primary model seeds, 2000 draws, nested with each checkpoint's data draws"
sign_test = true         # every primary's margin must carry the sign of the combined margin
tolerance = 0.02         # in |AUC - 0.5|: CI lower end above it passes, upper end below it fails, else inconclusive

[scoring.classic]        # does it warn better than the classic test
pairing = "the latent pair's |AUC - 0.5| minus the classic indicator's AUC - 0.5 taken in the direction the baseline's hypothesis on that indicator pre-registers (AUC - 0.5 for 'greater'), the classic AUCs recomputed on the baseline's price series over the same segments; the difference passes only when it exceeds the 97.5th percentile of the same difference recomputed on each of [scoring.shift]'s draws under scoring.seed, the latent and classic sides shifted by the same offsets, a null that carries the same folding of the latent side; its paired-bootstrap CI, on the same bootstrap draws, is reported and decides nothing; 'matching' compares each variance and level pair with the classic variance and the ac pair with the classic ac"
against = "matching"

[descriptive]
same_input = "the baseline's [same_input] tier, on the same segments, reported beside every latent cell; read by no decision rule, and counting no trial"
incremental_rv = "per pair, horizon and cell, the AUC of a two-variable logistic model (the latent score and the realised variance of the read symbol's 1-minute returns of the baseline's data.series, before deseasonalising, over the rv_minutes minutes up to the segment end) minus that of the realised variance alone, with its bootstrap CI; each model is fitted and scored on the same segments, so the AUCs are in-sample and the report is descriptive only, counting no trial"
rv_minutes = 60
ablations = []           # no EMA-only checkpoint is trained

[reporting]
groups = ["pooled", "per-asset", "eth-only"]
eth_only_bars = 12

[trials]
budget = 1312            # 2 (trained, twin) x 4 pairs x 4 horizons x 40 latent groups + 2 classic indicators x 4 horizons x 4 groups
counted = "One trial per AUC evaluation: per primary checkpoint, trained and twin, pair and horizon, of each group cells.groups defines (each cell it reads, each cell reading ETHUSDT for eth-only, and the pooled groups, one per model with judged all or one per seed with judged same-asset); and per classic indicator compared and horizon, of the classic AUCs recomputed on the paired segments, pooled, per read symbol and eth-only, since data.missing drops segments for the classic side too. Every scoring run appends its cells to ews/trials.jsonl in the data dir. Margins and differences reuse those AUCs and count none, and the latent-minus-classic difference recomputed on each event-time shift draw reuses the shift null's draws and counts none; the spares unless they replace a primary, the onset-hour strata, the cascade stress test, the same-input tier, the incremental report and the ablations are not counted."

[disclosure]
exploratory = """
All of the following read 2022-07-01..2023-12-31 only, and the trainings and the latent passes read 2023 only. No latent, indicator, segment, AUC or label of a day from 2024-01-01 on was computed or looked at, and ews/trials.jsonl holds no market-latent trial.

7 and 8 November 2026, the M4 pilot (harness/m4_pilot.py, merged in #182; its rules were accepted on 7 November, before any pilot score was read): one seed (100) per symbol at sizes S and M, 20,000 steps, trained from f9efb5d on 2023-01-18..2023-08-31 of the book features as reduced before the #170 fix, and scored by a next-minute ridge probe on September 2023 (1.0 is no better than the mean). Probe error at step 10,000: 0.6327 for BTC S and 0.7746 for ETH S, beside 0.7463 and 0.9385 for their untrained twins. The upper 95 % CI of S - M was -0.010 (BTC) and -0.009 (ETH), and the step-10,000 model was within 2 % of the step-20,000 one on both symbols (BTC 0.6327 against 0.6313, ETH 0.7746 against 0.7752). By the rules: size S (d = 64) and 10,000 steps.

8 November 2026, the M6 exploratory latent pass (merged in #183, run at e8c3121) on 2023-Q4, with the pilot's S checkpoints at step 10,000 and their step-0 twins, on the same pre-fix features: 15 BTC and 6 ETH events kept, against 31 and 39 controls, the midnight gap of #170 dropping a quarter to a third of the controls. Every pair's sign disagreed across horizons or symbols, and no column passed the screen rule (in both same-asset cells, some trained AUC whose CI excludes 0.5 and lies further from 0.5 than the twin's). The closest was pc_1 ac on ETH->ETH at h = 5 and 6, trained 0.718 and 0.709 beside twin 0.568 and 0.538, with nothing on BTC->BTC. Ranked by the mean trained-minus-twin |AUC - 0.5|, only pc_1 (+0.019) and pc_3 (+0.009) were above zero. The ETH model's pc_1 variance read on BTC reached 0.69-0.71, against 0.36-0.43 for BTC->BTC on the same pair.

13 November 2026, posted on 18 November: the M6 pass run again at 7dc6d12 on the FORMAT 4 features (after the #170 fix), with model seed 101 of each symbol, the primaries 20261111T105253Z-BTCUSDT-S-s101 and 20261111T131611Z-ETHUSDT-S-s101 pinned below, each beside its step-0 twin. Every event segment was kept: 17 BTC and 7 ETH events at each h, against 41 BTC and 54 ETH controls. Only surprise variance had one sign across the same-asset cells (greater), and no column passed the screen rule (the best, pc_4, had a mean margin of +0.056 over its twin and passed only at BTC h = 12 and 24). In the same-asset cells no trained AUC interval of the four pairs excluded 0.5 at any h; cross-asset, ETH->BTC pc_1 variance did at h = 5, 6 and 12 (0.661, 0.661 and 0.693). Of the 64 trained-minus-twin margins of the four pairs, 3 had an interval excluding 0: BTC->ETH pc_1 variance at h = 12 (-0.299), ETH->ETH surprise variance at h = 24 (+0.304) and BTC->ETH surprise level at h = 12 (+0.294). The intervals were about +/-0.17 on BTC and +/-0.25 on ETH, and the twin often read as high as the trained model or higher (ETH pc_1 variance: twin 0.61-0.75, trained 0.39-0.42). Mean surprise, trained over twin, showed no rise on the quarter against the training months.

The classic side's 2023 exploratory pass (8 November 2026), the same-input tier's 2023 read (9 November, on the features from before the #170 fix) and the GARCH floor reports (6, 12 and 18 November) were seen before this file was written; market-ews-v1's disclosure gives their numbers.

11 and 12 November 2026, the M8 trainings (harness/m8_primaries.py, merged in #187, run at 7dc6d12): the 14 runs pinned below, each reading its own symbol's FORMAT 4 training range, 2023-01-18..2023-08-31 for the gradient and September 2023 for the monitor. Each ran to 10,000 steps at its first attempt, and pins.json was written on 12 November. Their training-loss logs were read. No exploratory pass on #30 reads seeds 102 to 107.

By 18 November 2026, the confirmatory extraction's build (#212, commit 374f61d) was dry-run on 20 days of the 2023 exploratory range with a two-process plan, stopped after one unit and resumed, and its files verified. Its extractor refuses the confirmatory span without a gate record made from a frozen market-latent file, and none exists.
"""
decisions = """
Chosen on 8 November 2026 by the M4 pilot's rules, on book features reduced before the midnight fix (#170): size S (d = 64) and 10,000 steps. On 9 November both were kept for the M8 trainings, without rerunning the pilot on the re-reduced features.

Chosen on 9 November 2026 with the first M6 pass in view, and kept after the FORMAT 4 rerun: two-sided tests for all four pairs, read as |AUC - 0.5| with no direction pre-registered, because the directions disagreed across horizons and symbols (on the rerun, for every pair but surprise variance); and the four pairs as the only judged columns, because the exploratory screen proposed no column beyond them, on either pass.

Chosen while writing this file, with both M6 passes in view. cells.judged all: the research pass names cross-asset generalisation, the BTC model reading ETH and the ETH model reading BTC, as the issue's test, so the cross-asset cells are judged with the same-asset ones; the trial budget is 1312. On the rerun a cross-asset cell (ETH->BTC pc_1 variance) separated where no same-asset cell did; under judged all a pair warns only if it warns in all four cells and the pooled groups. scoring.classic.against matching. training.replacement: a spare replaces a primary only on a failed train.verify or a refused checkpoint, never for its scores, and is logged before any scored result is read. scoring.twin.seeds as ising-latent-v1's: a percentile bootstrap over the 5 primary model seeds, 2000 draws, nested with each checkpoint's data draws. scoring.twin.tolerance 0.02 in |AUC - 0.5|, with its rule: a combined margin passes when its 95 % CI's lower end is above 0.02, fails when its CI's upper end is below 0.02 (no margin of that size, or a twin that reads better), and is otherwise inconclusive; an inconclusive unit does not pass. On the rerun, one seed and one quarter, the margins' intervals were about +/-0.17 (BTC) and +/-0.25 (ETH), far wider than the tolerance. The predictions: three verdicts at h = 5 and 6 (warns, learned, beyond classic), h = 12 and 24 reported, and learned and beyond classic read and claimed only for a pair that warns. Warns asks every primary's |AUC - 0.5| to lie above the 95th percentile of the shift draws' |AUC - 0.5|, the two-sided counterpart of market-ews-v1's one-sided 97.5th percentile. The units the verdicts read are the four judged cells, each holding the five primaries of its model's symbol, and, per model symbol, its five primaries' pooled groups read together: under judged all each primary's pooled group holds one checkpoint, so all five on one side of 0.5 and the combined margin can only be read over a model symbol's five pooled groups. Beyond classic asks every primary's difference in a unit to pass, as warns asks every primary's AUC, since neither the schema nor the classic pairing combines the five seeds' differences. A unit that is inconclusive does not pass, as market-ews-v1 rules for its cells. The pooled groups, their shift null and the percentile method follow market-ews-v1's predictions: a pooled AUC is that of both read symbols' events against both read symbols' controls, the pooled shift moves each read symbol's onsets within its own eligible bars, and every percentile uses numpy's linear interpolation.

The seasonality fit span, 2023-01-18..2023-09-30, is the baseline's and overlaps the days the models were trained and validated on, so each latent's slot profile is fitted on days its model read (and, read across assets, on the other symbol's training days). The scored days, from 2024-01-01, were read by neither the models nor the profiles.

The latent-minus-classic rule passes above the 97.5th percentile of the 100 shift draws. Its level is between 3/101 and 4/101, not 2.5 %, depending on how the percentile is interpolated; under numpy's linear interpolation the 97.5th percentile lies between the 97th and 98th of the ordered draws, so the level lies strictly between the two. In #210's simulation with no effect, the rule passed 3.0 % to 4.1 % of repetitions.
"""
