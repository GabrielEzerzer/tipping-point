# Restated from the baseline and held equal to it by the freeze.
[indicators]
pairs = [["pc_1", "variance"], ["pc_1", "ac"], ["surprise", "variance"], ["surprise", "level"]]
window = 60
length = 240
lag = 1
detrend = "none"

[seasonality]
method = "mean"
fit = { start = 2023-01-18, end = 2023-09-30 }
strata = ["onset-hour"]

[segments]
horizons = [5, 6, 12, 24]
rule = "an event segment at horizon h bars ends with the minute that closes at the onset minus 5h minutes and holds the window + length - 1 minutes up to it; the length is the same at every horizon, a segment may start before the labels' clean window, and the share of its minutes in bars with H = 1 is reported"
controls = "control segments are the non-overlapping runs of window + length - 1 minutes cut in time order from the start of each null stretch of the labels run, one set for every horizon; with subsample n > 0, at most n of each symbol's are kept, drawn without replacement under the seed after the exclusions when there are more"
subsample = 0
seed = 30

# [model's symbol, read symbol]: each model reads both symbols, each with that symbol's own scaling.
[cells]
read = [["BTCUSDT", "BTCUSDT"], ["BTCUSDT", "ETHUSDT"], ["ETHUSDT", "BTCUSDT"], ["ETHUSDT", "ETHUSDT"]]
judged = "<same-asset or all, the cells the hypotheses judge; the others are reported>"
groups = "each primary checkpoint, trained and twin, is scored per [model's symbol, read symbol] cell (per-asset) and, with eth-only, per cell reading ETHUSDT; with judged 'all' each model's pooled group holds its two cells, and with judged 'same-asset' one pooled group per primary seed holds only that seed's BTCUSDT on BTCUSDT and ETHUSDT on ETHUSDT cells; the hypotheses read the judged cells and these pooled groups, and the other cells are reported; the classic AUCs are taken pooled over both symbols, per read symbol and on the eth-only segments"

[scoring]
statistic = "|AUC - 0.5|"
ci_level = 0.95
bootstrap = 2000
seed = 30

[scoring.shift]          # the latent's primary null: does it warn at all
draws = 100
min_offset_bars = 288

[scoring.surrogates]
secondary = "phase"
n = 999

[scoring.twin]           # did training matter
pairing = "trained minus twin of |AUC - 0.5|, same model seed, same read symbol, same segments and the same bootstrap draws; a judged cell passes only when every primary's trained AUC - 0.5 has the same sign, so that seeds warning in opposite directions never pass on their margins"
seeds = "<how the five primaries' margins combine, e.g. a percentile bootstrap over the 5 primary model seeds, 2000 draws, nested with each checkpoint's data draws>"
sign_test = true         # every primary's margin must carry the sign of the combined margin
tolerance = "<a number in (0, 0.5), in units of the statistic, set before the freeze>"

[scoring.classic]        # does it warn better than the classic test
pairing = "the latent pair's |AUC - 0.5| minus the classic indicator's AUC - 0.5 taken in the direction the baseline's hypothesis on that indicator pre-registers (AUC - 0.5 for 'greater'), the classic AUCs recomputed on the baseline's price series over the same segments, with the same bootstrap draws (a paired bootstrap); 'matching' compares each variance and level pair with the classic variance and the ac pair with the classic ac"
against = "<variance, ac, each or matching, the classic indicator each latent pair is compared with>"

[descriptive]
same_input = "the baseline's [same_input] tier, on the same segments, reported beside every latent cell; read by no decision rule, and counting no trial"
incremental_rv = "per pair, horizon and cell, the AUC of a two-variable logistic model (the latent score and the realised variance of the read symbol's 1-minute returns of the baseline's data.series, before deseasonalising, over the rv_minutes minutes up to the segment end) minus that of the realised variance alone, with its bootstrap CI; each model is fitted and scored on the same segments, so the AUCs are in-sample and the report is descriptive only, counting no trial"
rv_minutes = 60
ablations = []           # "ema-only" adds EMA-only checkpoints per symbol; none is trained yet

[reporting]
groups = ["pooled", "per-asset", "eth-only"]
eth_only_bars = 12

[trials]
budget = 1312            # 2 (trained, twin) x 4 pairs x 4 horizons x 40 latent groups + 2 classic indicators x 4 horizons x 4 groups; 1152 with judged = "same-asset"
counted = "One trial per AUC evaluation: per primary checkpoint, trained and twin, pair and horizon, of each group cells.groups defines (each cell it reads, each cell reading ETHUSDT for eth-only, and the pooled groups, one per model with judged all or one per seed with judged same-asset); and per classic indicator compared and horizon, of the classic AUCs recomputed on the paired segments, pooled, per read symbol and eth-only, since data.missing drops segments for the classic side too. Every scoring run appends its cells to ews/trials.jsonl in the data dir. Margins and differences reuse those AUCs and count none; the spares unless they replace a primary, the onset-hour strata, the cascade stress test, the same-input tier, the incremental report and the ablations are not counted."

[disclosure]
exploratory = "<what was seen before the freeze, and when>"
decisions = "<which choices were made with it in view>"
confirmatory = "<what v1 scores, from which commit, on which days>"
confirmatory_contact = "On 2026-11-06, while the book import was being built, a command-line test called the real downloader and fetched six Bybit order-book days from the confirmatory span, BTCUSDT and ETHUSDT 2024-01-01 to 2024-01-06, into a test's temporary folder. Every import failed, every archive was deleted, and the one partial file left was removed. No sample, feature, latent or label from those days was produced or looked at, and the book tests now refuse any network access."
links = []

[deviations]
policy = "<how changes after the freeze are handled>"
log = []
