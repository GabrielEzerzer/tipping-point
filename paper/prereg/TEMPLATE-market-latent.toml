# Pre-registration template for the market JEPA's latent warning test (#30 M9): copy to
# market-latent-v<k>.toml, replace every "<...>" and "TBD", commit, then
# `python -m tipping_point.ews prereg freeze <id>` tags the commit prereg/<id>-v<k>. The freeze
# refuses a file that still holds a placeholder, and one whose [baseline] is not a frozen
# market-ews file with this file's sha256 and the same cells (below). To change anything after the
# freeze, write <id>-v<k+1>.toml with `supersedes` and `reason`. Units as in market-ews: bars are
# 5-minute bars on the UTC grid, minutes are 1-minute series, days are UTC days.
#
# Set here, at the #30 research pass's values (sections 6.1-6.6, 7.3) and the decisions of
# 2026-11-06 and 2026-11-09: the frozen classic test as the baseline, whose labels, events,
# pipelines, seasonality, segments, AUC bootstrap, event-time shift, phase surrogates and reporting
# groups this file restates and the freeze holds equal to it, so that the latent and classic tests
# are scored on the same segments; the primaries' training (size S, d = 64, 10,000 steps, seeds
# 101-105 with spares 106 and 107 per asset, the M4 split); the four pairs, each tested two-sided
# as |AUC - 0.5|, with no direction pre-registered; the four cross-asset cells; the event-time
# shift as the latent's primary null (the GARCH floor needs a simulated order book and is not
# computed); the margin over each checkpoint's untrained twin and the paired latent-minus-classic
# difference; the same-input tier and the incremental AUC over trailing realised variance as
# descriptive reports.
#
# Open until the freeze (placeholders): the baseline's sha256 (market-ews-v1 is not frozen yet),
# every checkpoint pin (copied from m8_primaries' pins.json, one entry per pin), the rule for a
# spare taking a primary's place, which cells the hypotheses judge, how the five primaries' twin
# margins combine and their tolerance, which classic indicator each pair is compared with, the
# hypotheses' decision rules, and the disclosure. disclosure.decisions must say that the size and
# step count were chosen on data reduced before the midnight fix (#170), and that the exploratory
# screen proposed no column beyond the four pairs.

id = "<lowercase-slug>"
version = 1
supersedes = ""          # "<id>-v<k>" this version amends, or ""
reason = ""              # why it amends that version (required when supersedes is set)
question = "<what this test asks, in one sentence>"

# One per judged pair (the four pairs only, 2026-11-09), each two-sided: the trend score's
# AUC is read as its distance from 0.5. The prediction states the decision rule.

[[hypotheses]]
name = "pc1-variance"
column = "pc_1"
indicator = "variance"
statement = "The rolling variance of the leading latent component moves away from its calm-window distribution over the four hours before a regime-shift onset, in either direction."
prediction = "<the decision rule, e.g. in each judged cell and pooled at h = 5 and 6: the AUC's 95 % CI excludes 0.5, its distance from 0.5 lies above the event-time shift's 95th percentile, and the twin margin's CI lies above the tolerance>"
direction = "two-sided"

[[hypotheses]]
name = "pc1-ac"
column = "pc_1"
indicator = "ac"
statement = "The lag-1 autocorrelation of the leading latent component moves away from its calm-window distribution over the four hours before a regime-shift onset, in either direction."
prediction = "<the decision rule, as for pc1-variance>"
direction = "two-sided"

[[hypotheses]]
name = "surprise-variance"
column = "surprise"
indicator = "variance"
statement = "The rolling variance of the surprise moves away from its calm-window distribution over the four hours before a regime-shift onset, in either direction."
prediction = "<the decision rule, as for pc1-variance>"
direction = "two-sided"

[[hypotheses]]
name = "surprise-level"
column = "surprise"
indicator = "level"
statement = "The level of the surprise moves away from its calm-window distribution over the four hours before a regime-shift onset, in either direction."
prediction = "<the decision rule, as for pc1-variance>"
direction = "two-sided"

[data]
domain = "market-latent"
symbols = ["BTCUSDT", "ETHUSDT"]   # both: each symbol's model reads both symbols
missing = "a minute whose latent or surprise is not finite in any table read on that symbol (a feature gap in the minute, or no valid minute in the predictor's context) has no value; a segment holding such a minute, or one the baseline excludes on that symbol, is excluded for every column, indicator and checkpoint, latent and classic alike, and counted, so that every comparison is paired on the same segments"

[data.labels]            # the baseline's labels, which the freeze holds equal
tag = "prereg/market-labels-v1"
sha256 = "d5988eab9e1bab7442e8d56dd7d80388d1696a6cb0ef6d6b4d4bb50f26507458"

[data.events]
primary = "regime-shifts"
stress = "cascades"

# The frozen classic test whose segments this file is scored on. Neither file is scored on
# confirmatory data before both are frozen (#30 choice 10).
[baseline]
tag = "prereg/market-ews-v1"
sha256 = "<sha256 of the frozen market-ews file>"

# The primaries (harness/m8_primaries.py): one model per symbol, each trained on its own symbol's
# 1-second book features; the twin of each is its step-0 checkpoint.
[training]
span = { start = 2023-01-18, end = 2023-08-31 }
validation = { start = 2023-09-01, end = 2023-09-30 }
features = ["ret", "rv100", "moves", "micro_dev", "imb_1", "imb_5", "imb_20", "ofi", "depth_5", "depth_20", "depth_asym", "slope_b", "slope_a", "wide"]
feature_format = 4       # book.features.FORMAT 4: second 0 seeded from the previous day's book (#170)
scaling = "each model's features are scaled by the record fitted on its own symbol's training days (jepa.days); a model reading the other symbol takes that symbol's record, fitted on its training days, never refitted on what is read"
size = "S"
dim = 64
steps = 10000
primaries = [101, 102, 103, 104, 105]
spares = [106, 107]
replacement = "<when a spare takes a primary's place, e.g. a primary whose training fails train.verify is replaced by the next spare, logged in deviations>"
refusals = "jepa.days refuses any day from 2024-01-01 as a training input, and any feature file whose metadata names another symbol, day, feature format or feature list; a checkpoint is pinned only from a complete training of the primaries' configuration whose every day read is its data manifest's file"

# What a checkpoint's latent table holds, and the columns the pairs read; pc_2..pc_8 and surprise5
# are extracted but judged by nothing.
[latents]
columns = ["pc_1", "surprise"]
context = 96             # minutes a predictor chunk holds: the readout sees the 95 before minute m
series = "per UTC minute m of the read symbol and per checkpoint, trained and twin alike: surprise, the error of the delta = 1 prediction of z_m from the context - 1 minutes before it, and pc_1 to pc_8, z_m on the PCA basis saved with that checkpoint, z_m being the target encoder's latent of minute m; read as two contiguous series, one over [seasonality]'s fit span and one from 5 x the largest horizon + window + length - 1 + context - 1 minutes before 2024-01-01 (514 minutes at horizons up to 24 bars, window 60, length 240 and context 96) to the end of the labels' confirmatory span, so that the first minute of a segment ending at the earliest confirmatory onset has its full context; each value known when minute m closes, and deseasonalised as [seasonality] says, with a slot profile fitted per column, checkpoint and read symbol over its fit span"
pca = "each checkpoint's own basis, saved with it by the trainer (final.pt for the trained model, the step-0 checkpoint for its twin): 8 components fitted on 4,096 valid minutes of its training days drawn with replacement under the run's pca seed stream"

[[latents.checkpoints]]
symbol = "BTCUSDT"
seed = 101
role = "primary"
run_id = "<run id, from pins.json>"
data_commit = "<data commit, from pins.json>"
trained_sha256 = "<sha256 of final.pt, from pins.json>"
twin_sha256 = "<sha256 of the step-0 twin, from pins.json>"
pca_sha256 = "<sha256 of the PCA record, from pins.json>"
scaling_sha256 = "<sha256 of the scaling record, from pins.json>"

