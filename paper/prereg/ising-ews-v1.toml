# Pre-registration: the classic early-warning baselines on the 2D Ising model (#26: research
# pass 2026-10-22, owner's calls 1-6; freeze decisions 2026-10-25, #26 comment 6402030372).
# data.tau_c is the #54 record: L = 16, 32 and 64 at 64 replicas and L = 128 at 32, from one
# commit and one kernel, the kernel.py this version runs. The record is committed byte for byte
# as python/tipping_point/tests/fixtures/ising_pilot.json, the same sha256, so anyone can check
# it. L = 128 is decided out of v1 (decision 5): the record measures it, v1 never reads it, and
# trials.budget stays 972. The surrogate test is recalibrated on real fixed-T nulls (4.4-5.6%
# false positives at alpha = 0.05, #28). Units: time in tau_c(L) = tau_int(|m|) at Tc on the
# frozen kernel, as measured per L in the record; its fitted z and any tau_c extrapolated to an
# unmeasured L are never pre-registered on (#50 review); temperature in eps_L = L (T - Tc) / Tc;
# lags in samples of the cadence.

id = "ising-ews"
version = 1
supersedes = ""
reason = ""
question = "Do the classic early-warning indicators of |m| warn of the 2D Ising transition on a slow ramp, and do they obey finite-size scaling, so that they can serve as the positive control and the baseline for the latent signals of #28?"

[[hypotheses]]
name = "static-positive-control"
statement = "At the staircase plateau nearest Tc, L^2 Var(|m|), the mean of |m| and the skewness of |m| scale with the exact 2D Ising exponents."
prediction = "Fitted exponents over L lie within 0.1 of 7/4, within 0.02 of -1/8 and within 0.1 of 0 (match verdicts in fss.static); a miss is a pipeline bug, checked before any latent number is read."
direction = "match"

[[hypotheses]]
name = "classic-rise"
statement = "Var(|m|) and the lag-1 autocorrelation of |m| rise before the bath reaches Tc on the slow ramp."
prediction = "At the headline cell, dense cadence, the AUC of positives against fixed-T nulls has a 95% CI above 0.5 for every L and h."
direction = "greater"

[[hypotheses]]
name = "skewness-falls"
statement = "The skewness of |m| falls as the bath approaches Tc, from the positive value of a disordered lattice towards the negative value it holds at Tc."
prediction = "At the headline cell, dense cadence, the AUC has a 95% CI below 0.5 for every L and h."
direction = "less"

[[hypotheses]]
name = "dynamic-fss"
statement = "Var(|m|) peaks at a fixed scaled temperature on the slow ramp: the eps_L at which each replica's rolling variance of |m| (the headline pipeline's detrend, window and lag) reaches its maximum inside eps_L in [6, -4] does not depend on L."
prediction = "1/nu = 1 - d log|eps_L_peak| / d log L, fitted on the median peak eps_L per L, with a 95% CI from the hierarchical bootstrap (seeds, then replicas). The dense cadence's 1/nu carries the pre-registered verdict (fss.dynamic.cadence); the matched cadence's is computed and reported as a robustness check, without a verdict. The verdict is read in this order. (1) Inconclusive if 1/nu has no value (the per-L medians lie on both sides of Tc, or no peak was located at some L); if at any L more than half of the replicas' peaks are not located (they sit on an edge of the search band, or the band holds no value); or if fewer than 95% of the bootstrap draws give 1/nu a value (draws_used < fss.dynamic.min_draw_share = 0.95: a draw has none when its per-L medians lie on both sides of Tc or it drew no located peak at some L, and a CI on the rest would rest on a sign-selected subset). (2) Otherwise fail if the CI lies wholly outside [0.5, 1.5], or if its half-width is at most 0.5 and either |1/nu - 1| > 0.5 or the CI holds 0. (3) Otherwise pass if |1/nu - 1| <= 0.5, the CI's half-width is at most 0.5 and the CI excludes 0. (4) Otherwise inconclusive: a CI of half-width above 0.5 that does not lie wholly outside [0.5, 1.5]. The test separates two hypotheses, finite-size scaling (1/nu = 1) and an indicator merely monotone in T (1/nu = 0); the tolerance of 0.5 is the midpoint between them. The measured 1/nu, its CI and draws_used are reported either way."
direction = "match"

[[hypotheses]]
name = "ac1-reference"
statement = "At a one-sweep lag, 1 - AC1(|m|) at Tc tracks 1/chi (Halperin), not 1/tau: its exponent is near -gamma/nu = -7/4, not -z."
prediction = "The fitted exponent of 1 - AC1 (lag one sweep, pairs inside bursts) is negative with a CI excluding 0; the measured value is the reference that latent AC1 is compared with in #28, never z."
direction = "less"

[data]
domain = "ising"
L = [16, 32, 64]
# data.seeds: no earlier run that v1 scores or compares against used them. The only earlier
# seed-6 runs are the three grid pilots under data.staircase, which set the dwell and are never
# scored. Seeds 1-5 are the exploratory pilot (disclosure).
seeds = [6, 7, 8, 9, 10]
replicas = 64              # the GPU loop is launch-bound: 64 replicas cost what 16 did (#48)
exclusions = []

[data.tau_c]
source = "pilot"         # measured per L; never the fit's z or an extrapolated tau_c
pilot_run = "20261025T194846Z-tauc-L16-32-64-128"  # <data dir>/ising/<run>/pilot.json (#54)
pilot_sha256 = "7c5a4a296f2d8d1d55e223e4c775cd98267c43e6ae89f5e6ec594ac5c0581698"

[data.ramps]
kind = "ramp"
x = 0.02                 # the slow ramp, r = tau_c(L) L / (x Tc) with tau_c(L) as measured (#56)
eps_L = [12.0, -8.0]     # every ramp cools from eps_L = 12 to -8 after its equilibration

[data.nulls]
kind = "fixed"
eps_L = [2.0, 4.0, 6.0]  # >= 5 seeds each, each run holds two slices the length of a positive segment

[data.staircase]
kind = "staircase"
temperature = 2.269231   # grid point Tc + 4.5e-5; plateaus failing `thermalised` are dropped

# The staircases' dwell (--tau) is read from three seed-6 grid pilots, made on Kaggle at commit
# 655949a (kernel tp-ising-job-a), 40 points each, none unreliable. Below, per L, the sha256 of
# the pilot's tau.json. A scored staircase's manifest must name it, in
# params.schedule.params.tau_sha256: the scorer refuses another file's, or none, which is what a
# number given to --tau leaves.
[data.staircase.tau_sha256]
16 = "88d0878b63b6608af7bc03a6c2bf2812f24b50e54ea9af4f77c9a082e0632138"  # 20261025T220933Z-L16-pilot-s6
32 = "f5adbf804f658eb30cdf44ae2cc218336b8d828a859da292cda88a41ccf1d610"  # 20261025T220814Z-L32-pilot-s6
64 = "e3239a04e033f2e0f693dedea481a16e1c69271072e4df25fa1c3de30efc93e9"  # 20261025T220810Z-L64-pilot-s6

[indicators]
names = ["variance", "ac", "skewness"]
observables = ["abs_m", "energy"]   # |m| first; energy per site second
cadences = ["dense", "matched"]     # parity is claimed against dense, added information against matched
thin = 0.1
lag = 1
detrend = "gaussian"
direction = { variance = "greater", ac = "greater", skewness = "less" }  # hypotheses 2 and 3

[event]
definition = "The bath crosses the exact Tc = 2/ln(1 + sqrt 2), at step t_c in the run's manifest: the same for every replica and signal, and fixed before any data exist."
horizons = [0.0, 1.0, 2.0]
segment = 6.0

[scoring]
positives = "s at the sample where each slow-ramp replica's bath first reaches eps_L = h: the pipeline on the segment from eps_L = h + 6 down to h, plus one window before it, detrended on its own."
negatives = "s at the end of equal-length, non-overlapping segments of the fixed-T null runs' measured rows (all parameters fixed, Bury et al. 2021)."
auc = "Mann-Whitney, ties count 1/2, per (indicator, observable, cadence, L, h, window, bandwidth)"
alpha = 0.05
ci_level = 0.95
bootstrap = 2000

[scoring.surrogates]
primary = "phase"
secondary = "ar1"
n = 999
cells = "headline"

[scoring.alarms]
indicators = ["variance", "ac", "skewness"]  # a reported table that no hypothesis reads (#97)
far = 0.001              # theta: 1 false alarm per 1000 tau_c on one half of the null runs
report_per = 1000.0      # false alarms per 1000 tau_c on the other half
band = [2.0, -2.0]       # first alarm sought from eps_L = 2 down to -2; none is a miss
every = 1.0

[[fss.static]]
quantity = "l2_var_abs_m"
role = "positive-control"
expected = 1.75
tolerance = 0.1

[[fss.static]]
quantity = "mean_abs_m"
role = "positive-control"
expected = -0.125
tolerance = 0.02

[[fss.static]]
quantity = "skewness_abs_m"
role = "positive-control"
expected = 0.0
tolerance = 0.1

[[fss.static]]
quantity = "tau_int_abs_m"
role = "descriptive"     # z of local Metropolis, about 2.17; not exact, so not a control
expected = 2.17

[[fss.static]]
quantity = "one_minus_ac1"
role = "reference"       # lag one sweep from burst pairs; the measured kappa is the reference
tolerance = 0.1          # its own: the value it took from fss.dynamic before the freeze

[fss.dynamic]
statistic = "peak"       # each slow-ramp replica's eps_L at its indicator's extremum (#98)
indicators = ["variance"]  # AC1 and skewness peaks are reported in the peaks table, not judged
observable = "abs_m"
cadence = "dense"        # the verdict's; the matched cadence's row is a robustness check
search = [6.0, -4.0]     # the eps_L band the extremum is sought in
expected_inverse_nu = 1.0
tolerance = 0.5          # midway between FSS (1/nu = 1) and monotone in T (1/nu = 0)
min_draw_share = 0.95    # fewer draws giving 1/nu a value: inconclusive, the CI sign-selected

[sensitivity]
window = [10.0, 20.0, 40.0]
bandwidth = [5.0, 10.0, 20.0]
headline = { window = 20.0, bandwidth = 10.0 }

[trials]
budget = 972             # 3 indicators x 2 observables x 2 cadences x 3 L x 3 h x 9 cells
counted = "One trial per AUC evaluation of an (indicator, observable, cadence, L, h, window, bandwidth) cell, sensitivity cells included; every score run appends its cells to ews/trials.jsonl in the data dir."

[disclosure]
exploratory = "Before the freeze, the seeds 1-5 datasets at L = 16 and 32 were scored exploratorily: AUC, surrogate tests, alarms, peak positions and the static exponents."
decisions = "The freeze decisions were made with those results in view: the peak-position statistic of dynamic-fss, its search band and tolerance, the alarm target, the ramp rate from measured tau_c, the eps_L window of the ramps, and the seeds and replicas."
confirmatory = "v1 scores only runs generated from the tagged commit, on seeds 6-10. No earlier run that v1 scores or compares against used those seeds: the only earlier seed-6 runs are the three grid pilots under data.staircase, which set the dwell and are never scored. The scorer refuses a run whose manifest names another commit or a dirty tree, a ramp or null run made against another tau_c record, and a staircase whose dwell was read from another tau.json or given as a number. The seeds 1-5 datasets are never scored under v1. Each run's random stream is derived from its seed and its identity (size, replicas, start and schedule; the manifest's rng block names the derivation), so runs at one seed draw different numbers and one run made twice, on one device type and torch version, draws the same. The earlier runs, the seeds 1-5 datasets and the grid pilots among them, took their stream from the seed alone."
links = [
    "https://github.com/GabrielEzerzer/tipping-point/issues/26#issuecomment-6402030372",
    "https://github.com/GabrielEzerzer/tipping-point/issues/26#issuecomment-6387307847",
    "https://github.com/GabrielEzerzer/tipping-point/issues/26#issuecomment-6390788147",
    "https://github.com/GabrielEzerzer/tipping-point/issues/26#issuecomment-6393467391",
]

[deviations]
policy = "Any change after the freeze is a new version with a reason, frozen before it is scored; results scored under v1 stay bound to v1 and are reported."
log = []
