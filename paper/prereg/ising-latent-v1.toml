# Pre-registration: the latent signals of a JEPA on the 2D Ising model (#28). Its rules were
# rewritten on 2 November 2026, after the exploratory reads of primary models m1 and m2, and every
# placeholder of the draft was filled that day but baseline.result, which takes the run id of
# ising-ews-v1's result on these runs once that score completes. The decisions, each with its
# reason, are recorded on #28 and in disclosure.decisions. Units as in ising-ews-v1: time in
# tau_c(L) as measured per L, temperature in eps_L = L (T - Tc) / Tc, lags in samples of the
# cadence. Read [disclosure] first.

id = "ising-latent"
version = 1
supersedes = ""
reason = ""
question = "Do early-warning signals read from a JEPA's latents (prediction-error surprise, variance and lag-1 autocorrelation of the leading principal component) warn of the 2D Ising transition on a slow ramp and obey finite-size scaling, and does the trained encoder do so beyond what its untrained twin already gives?"

[[hypotheses]]
name = "latent-pipeline-check"
statement = "A random local encoder's pc_1 is spin-coupled: at the Tc plateau, L^2 Var(pc_1) of every step-0 twin scales as L^(7/4) (locality, #27)."
prediction = "kappa within 0.15 of 1.75 for every twin; a miss is a pipeline bug and no other latent row is read until it is fixed. The trained checkpoints' kappa is reported beside it and not judged."
direction = "match"

[[hypotheses]]
name = "latent-variance-rises"
statement = "Var(pc_1) and AC1(pc_1) rise before the bath reaches Tc on the slow ramp, as |m|'s do."
prediction = "Headline cell, matched cadence: the trained rows pass when all five primary checkpoints' AUC 95% CIs lie above 0.5 at every L and h, for Var(pc_1) and for AC1(pc_1); the twin rows are read by the same rule, separately, as the pipeline's. Parity with |m| at the matched cadence under ising-ews-v1 is reported, not judged."
direction = "greater"

[[hypotheses]]
name = "surprise-trend"
statement = "The level of surprise changes monotonically as the bath cools towards Tc."
prediction = "Descriptive: the level's AUC at the headline cell, oriented to 'less', is reported for every trained checkpoint and twin at every L and h; no verdict."
direction = "less"  # the orientation of a reported number, not a bet; the validator holds it equal to the level's

[[hypotheses]]
name = "latent-dynamic-fss"
statement = "Latent indicators that track the transition take their extremum at a fixed scaled temperature: eps_L_peak of Var(pc_1) and of Var(surprise) is the same at every L."
prediction = "1/nu within 0.5 of 1 with a CI excluding 0 for every twin's Var(pc_1); the trained Var(pc_1) and Var(surprise) are reported with the same intervals and the same edge rule, with no verdict."
direction = "match"

[[hypotheses]]
name = "learned-beyond-random"
statement = "Training adds physics a random local encoder lacks: energy becomes linearly readable at the frame level."
prediction = "Paired by model seed, trained minus twin, on the 128-dimensional embedding: (a) the energy-probe R^2 margin: the 95% CI over the five primary seeds of the mean over L lies above 0, and all fifteen paired margins (five seeds at three sizes) are positive; (b) the same for energy-probe selectivity. 'Learned the physics' is claimed only if (a) and (b) hold."
direction = "greater"

[[hypotheses]]
name = "held-out-band"
statement = "Dropping T in [2.0, 2.5] from training separates distribution shift from physics in the surprise curve."
prediction = "Descriptive at 3 seeds: mean surprise on the band's plateaus and the peak-position table beside the primary's; no verdict. The band drops 10 of the validation seed's 40 plateaus."
direction = "two-sided"

[[hypotheses]]
name = "ema-only"
statement = "Without the VICReg terms the representation may partially collapse (C-JEPA)."
prediction = "Descriptive at 3 seeds: collapse monitors, probe R^2 and the same tables; no verdict. A seed whose final.pt the extraction refuses as collapsed contributes its training monitors and its twin's rows only, and the table says so."
direction = "two-sided"

