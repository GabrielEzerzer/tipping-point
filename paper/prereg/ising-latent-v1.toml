[indicators]
names = ["variance", "ac", "level"]
observables = ["pc_1", "surprise"]
pairs = [["pc_1", "variance"], ["pc_1", "ac"], ["surprise", "variance"], ["surprise", "level"]]
cadences = ["matched"]
lag = 1
detrend = "gaussian"              # variance and ac only; level runs on the raw series
# level: the orientation of surprise's level AUC (below), a reported number since surprise-trend is descriptive; the validator still requires it
direction = { variance = "greater", ac = "greater", level = "less" }

[indicators.direction_by_observable]
# seeds 1-5, pilot seed 100, by a rule fixed before the numbers: the sign of the trained table's median s at the headline cell at every L and h; the grid agreed
# variance: s +0.38 to +0.81 over the grid, rising as the bath cools. level: s -0.55 to -0.95, falling; its twin's rises (+0.45 to +0.83), reported, not used
# level is now the orientation of a reported number, with no verdict on it (surprise-trend is descriptive); the validator requires it and holds surprise-trend's direction to it
surprise = { variance = "greater", level = "less" }

[event]
definition = "The bath crosses the exact Tc = 2/ln(1 + sqrt 2), at step t_c in the run's manifest: the same for every replica, signal and checkpoint, fixed before any data exist."
horizons = [0.0, 1.0, 2.0]
segment = 6.0

[scoring]
positives = "s at the sample where each slow-ramp replica's bath first reaches eps_L = h: the pipeline on the segment from eps_L = h + 6 down to h, plus one window before it, detrended on its own (variance, ac) or raw (level)."
negatives = "s at the end of equal-length, non-overlapping segments of the fixed-T null runs' saved frames."
auc = "Mann-Whitney, ties count 1/2, per (checkpoint, observable, indicator, L, h, window, bandwidth)"
alpha = 0.05
ci_level = 0.95
bootstrap = 2000

[scoring.surrogates]
primary = "phase"
secondary = "ar1"                 # not applied to level (no detrending): level rows carry phase only
n = 999                           # primary checkpoints and their twins, at the headline cell
n_ablation = 199                  # ablation checkpoints, whose rows are descriptive (call 7, amended)
cells = "headline-h0"             # surrogates at the headline cell for h = 0 only, agreed on 1 November as a scoring-time lever

[scoring.alarms]
far = 0.001                       # 1 per 1,000 tau_c, as the v1 freeze; a reported table, never a hypothesis
report_per = 1000.0
band = [2.0, -2.0]
every = 5.0                       # s(t) every 5 tau_c rather than 1 (1 November): a shorter scoring of a table no hypothesis judges

[scoring.margins]
pairing = "trained minus twin, same model seed, same data bootstrap draws (shared RNG seed per quantity)"
seeds = "percentile bootstrap over the 5 primary model seeds, 2000 draws, nested with each checkpoint's data draws"
sizes = "every"                   # a checkpoint's judged R^2 and selectivity is the mean over L, and the sign test also asks every seed's margin at every L
sign_test = true                  # every paired margin must carry the predicted sign
tolerance = 0.002                 # in R^2: a CI holding 0 inside this band is a fail (no margin), wider it is inconclusive; the owner's number, its rule in disclosure.decisions
ablations = "descriptive"

[[fss.static]]
quantity = "l2_var_pc_1"
role = "pipeline-check"           # judged like a positive control, on the twins alone; a fail is a pipeline bug
expected = 1.75
tolerance = 0.15
judged = "twin"                   # the trained checkpoints' kappa is reported beside it, never judged

[[fss.static]]
quantity = "mean_pc_1"
role = "descriptive"              # not -1/8: pc_1 is centred on the training mean, so the pilot's slopes were +0.13, and -0.37 on the twin

[[fss.static]]
quantity = "l2_var_surprise"
role = "descriptive"              # reported against 7/4 and 0
# kappa on the reads: +0.146 (m1) and +0.252 (m2), twins +1.569 and +1.444

[[fss.static]]
quantity = "mean_surprise"
role = "descriptive"              # does the error at Tc grow with L once L exceeds the predictor's 50-site range?

[[fss.static]]
quantity = "one_minus_ac1_pc_1"
role = "descriptive"              # reported against v1's one_minus_ac1 of |m| (about -1.6), never against z
# kappa on the reads: -0.681 (m1) and -0.344 (m2), twins -1.591 and -1.608

[fss.dynamic]
# Positions are read half the headline window late (0.2 eps_L), and a read position within noise of
# 0 is inconclusive.
search = [6.0, -4.0]
cadence = "matched"
expected_inverse_nu = 1.0
tolerance = 0.5
min_draw_share = 0.95
edge_rule = "inconclusive when more than half of an L's replicas take their extremum on an edge of the band or within one headline window of it"
edge_margin = "window"            # one headline window of ramp: a channel only rising to an edge has its maximum a few noisy samples inside it (#115)
statistics = [
  { observable = "pc_1", indicator = "variance", extremum = "max", role = "pipeline-check", judged = "twin" },
  { observable = "surprise", indicator = "variance", extremum = "max", role = "descriptive" },
]

[probes]
targets = ["abs_m", "energy", "l2var"]
controls = ["iid", "shuffle_within_T"]
fit = "the staircase of simulator seed 16 at each L: 20000 frames drawn without replacement, probe seed 0"
test = "the staircases of seeds 6-10 at each L: 20000 frames each, same rule"
ridge_alpha = 0.001
selectivity = "R^2(target) - R^2(shuffle_within_T)"
per = "checkpoint x L; each twin beside its trained checkpoint"

[sensitivity]
window = [10.0, 20.0, 40.0]
bandwidth = [5.0, 10.0, 20.0]     # level ignores it: 3 cells per (L, h)
headline = { window = 20.0, bandwidth = 10.0 }

[trials]
budget = 3132                     # 10 x 270 (primary + twins, full grid) + 12 x 36 (ablations, headline cell)
counted = "One trial per AUC evaluation of a (checkpoint, observable, indicator, L, h, window, bandwidth) cell; every scoring run appends its cells to ews/trials.jsonl. Judged non-AUC rows are listed in the result manifest and printed in the paper."

[disclosure]
exploratory = "Before this file was written, a pilot checkpoint, model seed 100 at 10,000 steps (warm-up 500), trained at L = 16 and 32 on staircase seeds 11-15 with validation seed 16 and never scored here, was read with its step-0 twin over the exploratory seeds 1-5 datasets at L = 16 and 32: ramps and null runs whole, staircases under tc-plus. harness/explore scored those tables, logging no trial: surprise and pc_1 against T, trend scores and AUC over the whole grid, surrogate tests at N_s = 99, the alarm tables, peak positions and 1/nu at two sizes, pc_k against |m| and e, and ridge probes with their controls on the 8 principal components. jepa probe read final.pt and the twin on the 128-dimensional embedding, fitted on seed 16 and tested on seeds 1-5, and the training's monitors were read. What was seen, trained beside twin. pc_1 follows e more than |m| at the T = 2.269231 plateau (|r| 0.91 and 0.94 with e, 0.74 with |m|; the twin's pc_1 is -|m|, |r| 1.000), and kappa of L^2 Var(pc_1) is 0.10 [0.05, 0.15] beside the twin's 1.64 [1.53, 1.73], so latent-pipeline-check misses on that checkpoint and holds on its twin. Trained surprise falls as the bath cools, by about 0.03 from eps_L = 6 to a shallow dip at eps_L = +0.7 at both sizes, rises by about 0.01 to a hump near T = 2.1, and falls steeply below T = 2; the twin's rises through a sigmoid, and follows |m| (|r| 0.90-0.92 at that plateau). The trained rolling variances of pc_1 and of surprise keep rising through the search band, so 79-90% of replicas lie on its cold edge or within one window of it at both sizes: under the edge rule as first written that gave 1/nu near 1 and a pass though no peak was located, and under this file's rule, fss.dynamic.edge_margin, those statistics are inconclusive, and the same rule turns the trained slope of surprise, a test statistic of latent-dynamic-fss, from a pass at 1/nu +1.12 [+0.95, +1.49] to inconclusive at +2.35 [+1.21, +4.51], with 49% and 36% of its replicas on the edge or within one window of it, too few to leave it not located, so its interval decides it. The twin's peak inside the band, at eps_L about +0.6 to +0.9, with no replica near an edge and 1/nu inconclusive at two sizes. On the trained table the AUC at the headline cell, turned to each pair's direction, is 0.94-1.000 for all four pairs; on the twin it is 0.95-1.000 for pc_1's pairs and surprise's variance, and its level trends the other way. On the embedding, one model seed, no intervals: energy selectivity 0.1219 beside 0.1216 at L = 16 and 0.0335 beside 0.0334 at L = 32, about no margin; energy R^2 margin +0.0037 and +0.0016; l2var selectivity 0.1092 beside 0.0586 and 0.1014 beside 0.0518. No collapse monitor fired. The seeds 1-5 datasets, the L = 16, 32 and 64 training staircases and the tau_c record all took each run's random stream from its seed alone, which couples runs of one shape at one seed, in energy much more than in |m| (README: Which stream a run draws). These readouts follow energy, so the AUC and surrogate figures on the exploratory data, which treat a seed's runs as independent, may be somewhat too sure. After the primary trainings, two of the primary models were read beside their step-0 twins, model seed 1 (m1) on 1 November and model seed 2 (m2) on 2 November, on the seeds 1-5 datasets at L = 16 and 32 only, since no seeds 1-5 run holds frames at L = 64. On both, the trained pc_1 follows e rather than |m| (|r| with e 0.89-0.92 on m1 and 0.70-0.79 on m2), and kappa of L^2 Var(pc_1) is +0.265 on m1 and -0.226 on m2, beside +1.644 and +1.673 for the twins. Var(pc_1) at L = 32, h = 0 gives AUC 0.995 [0.988, 0.999] on m1 and 0.026 [0.011, 0.048] on m2. The level of surprise at L = 16, h = 0 gives AUC 0.495 [0.378, 0.602] on m1 and 0.869 [0.817, 0.914] on m2. Every trained dynamic statistic is inconclusive under the edge rule, with 81-89% of replicas at the cold edge or within one window of it, the twins' Var(surprise) is inconclusive too, and the slope's 1/nu has no value on either model (intervals [+4.35, +10.21] and [+5.28, +10.08]). Kappa of L^2 Var(surprise) is +0.146 on m1 and +0.252 on m2, twins +1.569 and +1.444, and kappa of 1 - AC1(pc_1) is -0.681 and -0.344, twins -1.591 and -1.608: both reference rows passed on both models, their CIs excluding 0, at exponents far from any physical value. On the embedding, with no intervals, the energy R^2 margin is +0.0047 at L = 16 and +0.0022 at L = 32 on m1 and +0.0054 and +0.0022 on m2, and the energy selectivity margin +0.0008 and +0.0004 on m1 and +0.0007 and +0.0004 on m2. On the 8-component probe, the 95th-percentile gap between redraws of the shuffle control for energy selectivity is 0.0014 and 0.0016 on the two models at L = 16, and 0.0004 and 0.0005 at L = 32. Models m3, m4 and m5 were not read before this rewrite. The monitor tables of the six ablation trainings were read on 2 November: no collapse monitor fired, and the three EMA-only encoders end with an effective rank of about 38 of 128, as at step 0, beside about 120 for the three held-out trainings, which keep the full loss. ising-ews-v1's result named in baseline.result was scored before this freeze, and no latent rule changed after it was seen."
decisions = "Made with the pilot's tables in view: surprise's directions, by a rule fixed before they were read (the sign of the trained table's median s), and fss.dynamic.edge_margin with the wording of edge_rule (#115), because the rule as first written passed channels with no located peak. The step count came from the pilot's timing, by call 9's rule. Made after the m1 and m2 reads, with m3, m4 and m5 unread: latent-pipeline-check is judged on the twins alone (judged = twin) and the trained kappa is reported, because the trained pc_1 follows energy on both models and its kappa missed 1.75 on both, and a check that fails on every trained checkpoint seen is a result, not a pipeline check of the trained model. latent-variance-rises takes one verdict over the five primaries, all five AUC intervals above 0.5, because a verdict on one model says little about another (Var(pc_1) at L = 32, h = 0: AUC 0.995 on m1, 0.026 on m2), and no code judges it: with per-checkpoint intervals the only over-seed rule a reader can apply is that all five lie on the predicted side (one-sided p = 1/32 were each seed a coin), the sign rule the margins use. surprise-trend is descriptive, its direction kept as the orientation of a reported AUC, because the level's AUC at L = 16, h = 0 was 0.495 on m1 and 0.869 on m2: its direction cannot be one bet, and reading it per size would need a reason beyond these reads. In latent-dynamic-fss, Var(pc_1) is a pipeline check on the twins alone, Var(surprise) is descriptive and the slope of surprise is dropped, because every trained dynamic statistic was inconclusive under the edge rule on both models and the slope's 1/nu had no value on either: a statistic that returns no estimate on two of two models is not kept as a test. learned-beyond-random keeps (a) and (b), each with every paired margin positive at every size (scoring.margins.sizes = every), and drops (c), the surprise finite-size-scaling share, which as written passed on neither model; the margins were positive at both sizes on both reads, so asking for the sign at every size costs nothing seen and closes the gap where a mean over L hides one size of the wrong sign. The reference rows l2_var_surprise and one_minus_ac1_pc_1 are descriptive and lose their tolerances, because a reference row passed on any CI excluding 0, which both did on both reads at exponents far from any physical value, so the rule could not fail. scoring.margins.tolerance is 0.002, the owner's number, by a rule: the largest 95th-percentile gap between redraws of the shuffle control seen on the reads, 0.0016, rounded up to one significant figure. It was measured on the 8-component probe, not on the 128-dimensional embedding the scorer judges, whose margins on the reads carry no interval. On the reads, the selectivity margins, +0.0004 to +0.0008, lie inside it, so (b) is more likely to fail than to pass unless the five seeds agree, and the R^2 margins, +0.0022 to +0.0054, lie outside it. The ablation hypotheses stay descriptive, with 199 surrogates and the headline cell alone; ema-only now says what a collapsed seed's rows hold, and held-out-band how many plateaus its band drops. On 1 November, to shorten the scoring, scoring.alarms.every became 5 (it was 1); the false-positive rate is still read from all null runs. The columns judged, the search band, the VICReg weights, the probe protocol and the 25,000 training steps were not changed by either read."
confirmatory = "ising-latent-v1 scores only the runs of ising-ews-v1 on seeds 6-10, which no checkpoint has read and no pass has seen, through the checkpoints pinned above: five primaries on model seeds 1-5 at 25,000 steps and six ablations, each with its step-0 twin. Seed 100 and the seeds 1-5 tables are never scored. Trainings read staircase seeds 11-16 alone and name this file's draft, sha256 4d9fd3ed79e02f3e0ec535dd02e2b4f8c6a716ceed5476a6a00fcc72e95552ad from before its placeholders were filled, so seeds 6-10 are refused; the freeze comes before any extraction on them (call 11), and each scored table must come from its tag's commit, from the checkpoint it pins."
links = ["https://github.com/GabrielEzerzer/tipping-point/issues/28"]

[deviations]
policy = "Any change after the freeze is a new version with a reason, frozen before it is scored; results scored under v1 stay bound to v1 and are reported. A collapsed primary seed is replaced by the next spare and the replacement is logged here."
