# Draft pre-registration: the latent signals of a JEPA on the 2D Ising model (#28). NOT frozen: the
# checkpoints and their sha256 wait for the primary and ablation trainings, baseline.result for the
# scoring of ising-ews-v1, and scoring.margins.tolerance for the owner; the freeze refuses each
# while it is a placeholder. Every other value is set: the research pass's calls (#28, 2026-10-25),
# the freeze lane's and the runner's keys, and what the exploratory pass on seeds 1-5 set, each with
# its reason beside it. Units as in ising-ews-v1: time in tau_c(L) as measured per L, temperature in
# eps_L = L (T - Tc) / Tc, lags in samples of the cadence. Read [disclosure] first: the pass found
# things that bear on hypotheses 1, 4 and 5, which stand here as decided before any latent number
# existed.

id = "ising-latent"
version = 1
supersedes = ""
reason = ""
question = "Do early-warning signals read from a JEPA's latents (prediction-error surprise, variance and lag-1 autocorrelation of the leading principal component) warn of the 2D Ising transition on a slow ramp and obey finite-size scaling, and does the trained encoder do so beyond what its untrained twin already gives?"

[[hypotheses]]
name = "latent-pipeline-check"
statement = "A local pooled encoder's pc_1 is spin-coupled: at the Tc plateau L^2 Var(pc_1) scales as L^(7/4) for trained checkpoints and twins alike (locality, #27)."
prediction = "kappa within 0.15 of 1.75 for every primary checkpoint and twin; a miss is a pipeline bug and no other latent row is read until it is fixed."
direction = "match"

[[hypotheses]]
name = "latent-variance-rises"
statement = "Var(pc_1) and AC1(pc_1) rise before the bath reaches Tc on the slow ramp, as |m|'s do."
prediction = "Headline cell, matched cadence: AUC 95% CI above 0.5 for every L and h, trained and twin. Parity with |m| at the matched cadence under ising-ews-v1; not a margin."
direction = "greater"

[[hypotheses]]
name = "surprise-trend"
statement = "The level of surprise changes monotonically as the bath cools towards Tc."
prediction = "Headline cell: AUC of the level trend has a 95% CI away from 0.5 in the pre-registered direction for every trained primary checkpoint at every L and h; twin rows reported."
direction = "less"  # seeds 1-5, pilot seed 100: on every ramp replica s falls, -0.59 to -0.89 median at all L, h

[[hypotheses]]
name = "latent-dynamic-fss"
statement = "Latent indicators that track the transition take their extremum at a fixed scaled temperature: eps_L_peak of Var(pc_1), of Var(surprise) and of the steepest change of surprise is the same at every L."
prediction = "1/nu within 0.5 of 1 with a CI excluding 0, per checkpoint (fss.dynamic). Var(pc_1) is expected to pass for trained and twin (pipeline). The two surprise statistics are the falsification test: a feature anchored to a fixed T gives 1/nu = 0."
direction = "match"

[[hypotheses]]
name = "learned-beyond-random"
statement = "Training adds physics a random local encoder lacks: energy becomes linearly readable at the frame level, and surprise obeys finite-size scaling where the twin's does not."
prediction = "Paired by model seed, trained minus twin: (a) energy-probe R^2 margin, 95% CI over the 5 primary seeds excludes 0 and all 5 margins are positive; (b) energy-probe selectivity (R^2 minus the within-plateau-shuffle control's R^2) is larger for the trained checkpoint on all 5 seeds; (c) at least one surprise statistic of latent-dynamic-fss passes for >= 4 of 5 trained checkpoints and for none of the twins. 'Learned the physics' is claimed only if (a), (b) and (c) hold."
direction = "greater"

[[hypotheses]]
name = "held-out-band"
statement = "Dropping T in [2.0, 2.5] from training separates distribution shift from physics in the surprise curve."
prediction = "Descriptive at 3 seeds: mean surprise on the band's plateaus and the peak-position table beside the primary's; no verdict."
direction = "two-sided"

[[hypotheses]]
name = "ema-only"
statement = "Without the VICReg terms the representation may partially collapse (C-JEPA)."
prediction = "Descriptive at 3 seeds: collapse monitors, probe R^2 and the same tables; no verdict."
direction = "two-sided"

[data]
domain = "ising"
L = [16, 32, 64]
seeds = [6, 7, 8, 9, 10]          # confirmatory, generated after the ising-ews-v1 freeze
replicas = 64
exclusions = []

[data.tau_c]
source = "pilot"
pilot_run = "20261025T194846Z-tauc-L16-32-64-128"  # #54's record, the one ising-ews-v1 pins
pilot_sha256 = "7c5a4a296f2d8d1d55e223e4c775cd98267c43e6ae89f5e6ec594ac5c0581698"

[data.ramps]
kind = "ramp"
x = 0.02
eps_L = [12.0, -8.0]

[data.nulls]
kind = "fixed"
eps_L = [2.0, 4.0, 6.0]

[data.staircase]
kind = "staircase"
temperature = 2.269231

# this file reads ising-ews-v1's confirmatory runs, so their dwell files are that file's, value for value
[data.staircase.tau_sha256]
16 = "88d0878b63b6608af7bc03a6c2bf2812f24b50e54ea9af4f77c9a082e0632138"  # 20261025T220933Z-L16-pilot-s6
32 = "f5adbf804f658eb30cdf44ae2cc218336b8d828a859da292cda88a41ccf1d610"  # 20261025T220814Z-L32-pilot-s6
64 = "e3239a04e033f2e0f693dedea481a16e1c69271072e4df25fa1c3de30efc93e9"  # 20261025T220810Z-L64-pilot-s6

[baseline]
prereg = "ising-ews-v1"           # the matched-cadence |m| rows of its result on these runs are the parity reference
# ising-ews-v1 is not frozen or scored yet, so no result exists to name: filled when one does
result = "<ews result run_id, filled when v1 has been scored>"

[latents]
table = "latents"                 # <run>/latents/<training>-step<step>/, keyed like configs
columns = ["surprise", "pc_1"]    # judged; pc_2..pc_8 are read and plotted, never judged
training_seeds = [11, 12, 13, 14, 15]
validation_seed = 16
steps = 25000                     # call 9: the pilot's joint L = 16/32/64 rate, 0.159 s/step, is 2.2 h per 50,000 on a T4, above 1.5 h and under 3; warm-up steps / 20 = 1,250
extraction = "ramps and nulls in full; staircases: the T = 2.269231 plateau in full and one burst in eight elsewhere (primary and twins); ablation checkpoints: the Tc plateau, ramps and nulls only"
spares = [6, 7]                   # a primary seed whose training collapses is replaced by the next spare, logged in deviations

[[latents.checkpoints]]
role = "primary"
model_seed = 1
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "primary"
model_seed = 2
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "primary"
model_seed = 3
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "primary"
model_seed = 4
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "primary"
model_seed = 5
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]          # var_weight = 0, cov_weight = 0
role = "ema-only"
model_seed = 11
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "ema-only"
model_seed = 12
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "ema-only"
model_seed = 13
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]          # --held-out: plateaus in [2.0, 2.5] dropped
role = "held-out"
model_seed = 21
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "held-out"
model_seed = 22
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[[latents.checkpoints]]
role = "held-out"
model_seed = 23
training = "<jepa run_id>"
trained_sha256 = "<final.pt>"
twin_sha256 = "<ckpt/step_0000000.pt>"

[indicators]
names = ["variance", "ac", "level"]
observables = ["pc_1", "surprise"]
pairs = [["pc_1", "variance"], ["pc_1", "ac"], ["surprise", "variance"], ["surprise", "level"]]
cadences = ["matched"]
lag = 1
detrend = "gaussian"              # variance and ac only; level and slope run on the raw series
# level: what the level of the one column it is judged on does, surprise (below)
direction = { variance = "greater", ac = "greater", level = "less" }

[indicators.direction_by_observable]
# seeds 1-5, pilot seed 100, by a rule fixed before the numbers: the sign of the trained table's median s at the headline cell at every L and h; the grid agreed
# variance: s +0.38 to +0.81 over the grid, rising as the bath cools. level: s -0.55 to -0.95, falling; its twin's rises (+0.45 to +0.83), reported, not used
surprise = { variance = "greater", level = "less" }

[event]
definition = "The bath crosses the exact Tc = 2/ln(1 + sqrt 2), at step t_c in the run's manifest: the same for every replica, signal and checkpoint, fixed before any data exist."
horizons = [0.0, 1.0, 2.0]
segment = 6.0

[scoring]
positives = "s at the sample where each slow-ramp replica's bath first reaches eps_L = h: the pipeline on the segment from eps_L = h + 6 down to h, plus one window before it, detrended on its own (variance, ac) or raw (level)."
negatives = "s at the end of equal-length, non-overlapping segments of the fixed-T null runs' saved frames."
auc = "Mann-Whitney, ties count 1/2, per (checkpoint, observable, indicator, L, h, window, bandwidth)"
alpha = 0.05
ci_level = 0.95
bootstrap = 2000

[scoring.surrogates]
primary = "phase"
secondary = "ar1"                 # not applied to level (no detrending): level rows carry phase only
n = 999                           # primary checkpoints and their twins, at the headline cell
n_ablation = 199                  # ablation checkpoints, whose rows are descriptive (call 7, amended)
cells = "headline"

[scoring.alarms]
far = 0.001                       # 1 per 1,000 tau_c, as the v1 freeze; a reported table, never a hypothesis
report_per = 1000.0
band = [2.0, -2.0]
every = 1.0

[scoring.margins]
pairing = "trained minus twin, same model seed, same data bootstrap draws (shared RNG seed per quantity)"
seeds = "percentile bootstrap over the 5 primary model seeds, 2000 draws, nested with each checkpoint's data draws"
sizes = "mean"                    # a checkpoint's judged R^2 and selectivity: the mean over L; rows per L are reported, never judged
sign_test = true                  # every paired margin must carry the predicted sign
tolerance = "<set before freeze>" # in R^2: a CI holding 0 inside this band is a fail (no margin), wider it is inconclusive; the owner's call
ablations = "descriptive"

[[fss.static]]
quantity = "l2_var_pc_1"
role = "pipeline-check"           # judged like a positive control; a fail is a pipeline bug
expected = 1.75
tolerance = 0.15

[[fss.static]]
quantity = "mean_pc_1"
role = "descriptive"              # not -1/8: pc_1 is centred on the training mean, so the pilot's slopes were +0.13, and -0.37 on the twin

[[fss.static]]
quantity = "l2_var_surprise"
role = "reference"                # kappa free; CI must exclude 0 to count as scaling; reported against 7/4 and 0
# half-widths at two sizes and 80 replicas: 0.045 trained, 0.109 twin; a third size and 320 replicas should give about a quarter, so a CI holding 0 can fail, not just be inconclusive
tolerance = 0.1

[[fss.static]]
quantity = "mean_surprise"
role = "descriptive"              # does the error at Tc grow with L once L exceeds the predictor's 50-site range?

[[fss.static]]
quantity = "one_minus_ac1_pc_1"
role = "reference"                # compared with v1's one_minus_ac1 of |m| (about -1.6), never with z
# half-widths at two sizes and 80 replicas: 0.049 trained, 0.094 twin, the same reasoning, and v1's own reference takes 0.1; no CI seen held 0, so this decided nothing seen
tolerance = 0.1

[fss.dynamic]
# Positions are read half the headline window late (0.2 eps_L), and a read position within noise of
# 0, a true steepest change near +0.2 eps_L rather than at Tc, is inconclusive.
search = [6.0, -4.0]
cadence = "matched"
expected_inverse_nu = 1.0
tolerance = 0.5
min_draw_share = 0.95
edge_rule = "inconclusive when more than half of an L's replicas take their extremum on an edge of the band or within one headline window of it"
edge_margin = "window"            # one headline window of ramp: a channel only rising to an edge has its maximum a few noisy samples inside it (#115)
statistics = [
  { observable = "pc_1", indicator = "variance", extremum = "max", role = "pipeline-check" },
  { observable = "surprise", indicator = "variance", extremum = "max", role = "test" },
  # min: follows the level's direction by the same rule; a surprise falling as the bath cools changes fastest at its slope's minimum
  { observable = "surprise", indicator = "slope", extremum = "min", role = "test" },
]

[probes]
targets = ["abs_m", "energy", "l2var"]
controls = ["iid", "shuffle_within_T"]
fit = "the staircase of simulator seed 16 at each L: 20000 frames drawn without replacement, probe seed 0"
test = "the staircases of seeds 6-10 at each L: 20000 frames each, same rule"
ridge_alpha = 0.001
selectivity = "R^2(target) - R^2(shuffle_within_T)"
per = "checkpoint x L; each twin beside its trained checkpoint"

[sensitivity]
window = [10.0, 20.0, 40.0]
bandwidth = [5.0, 10.0, 20.0]     # level ignores it: 3 cells per (L, h)
headline = { window = 20.0, bandwidth = 10.0 }

[trials]
budget = 3132                     # 10 x 270 (primary + twins, full grid) + 12 x 36 (ablations, headline cell)
counted = "One trial per AUC evaluation of a (checkpoint, observable, indicator, L, h, window, bandwidth) cell; every scoring run appends its cells to ews/trials.jsonl. Judged non-AUC rows are listed in the result manifest and printed in the paper."

[disclosure]
exploratory = "Before this file was written, a pilot checkpoint, model seed 100 at 10,000 steps (warm-up 500), trained at L = 16 and 32 on staircase seeds 11-15 with validation seed 16 and never scored here, was read with its step-0 twin over the exploratory seeds 1-5 datasets at L = 16 and 32: ramps and null runs whole, staircases under tc-plus. harness/explore scored those tables, logging no trial: surprise and pc_1 against T, trend scores and AUC over the whole grid, surrogate tests at N_s = 99, the alarm tables, peak positions and 1/nu at two sizes, pc_k against |m| and e, and ridge probes with their controls on the 8 principal components. jepa probe read final.pt and the twin on the 128-dimensional embedding, fitted on seed 16 and tested on seeds 1-5, and the training's monitors were read. What was seen, trained beside twin. pc_1 follows e more than |m| at the T = 2.269231 plateau (|r| 0.91 and 0.94 with e, 0.74 with |m|; the twin's pc_1 is -|m|, |r| 1.000), and kappa of L^2 Var(pc_1) is 0.10 [0.05, 0.15] beside the twin's 1.64 [1.53, 1.73], so latent-pipeline-check misses on that checkpoint and holds on its twin. Trained surprise falls as the bath cools, by about 0.03 from eps_L = 6 to a shallow dip at eps_L = +0.7 at both sizes, rises by about 0.01 to a hump near T = 2.1, and falls steeply below T = 2; the twin's rises through a sigmoid, and follows |m| (|r| 0.90-0.92 at that plateau). The trained rolling variances of pc_1 and of surprise keep rising through the search band, so 79-90% of replicas lie on its cold edge or within one window of it at both sizes: under the edge rule as first written that gave 1/nu near 1 and a pass though no peak was located, and under this file's rule, fss.dynamic.edge_margin, those statistics are inconclusive. The twin's peak inside the band, at eps_L about +0.6 to +0.9, with no replica near an edge and 1/nu inconclusive at two sizes. On the trained table the AUC at the headline cell, turned to each pair's direction, is 0.94-1.000 for all four pairs; on the twin it is 0.95-1.000 for pc_1's pairs and surprise's variance, and its level trends the other way. On the embedding, one model seed, no intervals: energy selectivity 0.1219 beside 0.1216 at L = 16 and 0.0335 beside 0.0334 at L = 32, about no margin; energy R^2 margin +0.0037 and +0.0016; l2var selectivity 0.1092 beside 0.0586 and 0.1014 beside 0.0518. No collapse monitor fired. The seeds 1-5 datasets, the L = 16, 32 and 64 training staircases and the tau_c record all took each run's random stream from its seed alone, which couples runs of one shape at one seed, in energy much more than in |m| (README: Which stream a run draws). These readouts follow energy, so the AUC and surrogate figures on the exploratory data, which treat a seed's runs as independent, may be somewhat too sure."
decisions = "Made with those results in view: surprise's directions and the slope's extremum, by a rule fixed before they were read (the sign of the trained table's median s; the extremum follows the level); the tolerances of the two reference rows; and fss.dynamic.edge_margin with the wording of edge_rule (#115), because the rule as first written passed channels with no located peak. The step count came from the pilot's timing, by call 9's rule. The hypotheses, the columns judged, the roles of the statistics, the search band, the VICReg weights and the probe protocol were not changed by what was seen: they stand as decided on #28 before any latent number existed, and what the pass found against them is reported there as open decisions, with scoring.margins.tolerance, which is still to be set."
confirmatory = "ising-latent-v1 scores only the runs of ising-ews-v1 on seeds 6-10, which no checkpoint has read and no pass has seen, through the checkpoints pinned above: five primaries on model seeds 1-5 at 25,000 steps and six ablations, each with its step-0 twin. Seed 100 and the seeds 1-5 tables are never scored. Trainings read staircase seeds 11-16 alone and name this file, so seeds 6-10 are refused; the freeze comes before any extraction on them (call 11), and each scored table must come from its tag's commit, from the checkpoint it pins."
links = ["https://github.com/GabrielEzerzer/tipping-point/issues/28"]

[deviations]
policy = "Any change after the freeze is a new version with a reason, frozen before it is scored; results scored under v1 stay bound to v1 and are reported. A collapsed primary seed is replaced by the next spare and the replacement is logged here."
log = []
