[workspace]
resolver = "3"
# A glob, so a crate added under harness/ is built and tested without being listed.
members = ["engine", "harness/*"]
# Non-crate dirs the glob matches; cargo refuses a member without a Cargo.toml, so any
# other non-crate dir under harness/ fails every cargo leg loudly until it is listed here.
exclude = ["harness/tests", "harness/out", "harness/__pycache__"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
