[workspace]
resolver = "3"
members = ["engine", "harness/engine-harness"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
engine = { path = "engine" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "query"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
