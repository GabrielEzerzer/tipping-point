[project]
name = "tipping-point-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["tipping-point"]

[tool.uv]
package = false

[tool.uv.sources]
tipping-point = { workspace = true }

[tool.uv.workspace]
members = ["python/*"]

[dependency-groups]
dev = ["ruff", "pytest", "pyright"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["harness/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["python", "harness"]
exclude = ["**/.venv", "harness/out", "harness/tests/fixtures"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
extraPaths = ["harness"]

[tool.pytest.ini_options]
testpaths = ["python", "harness/tests"]
pythonpath = ["harness"]
addopts = ["--import-mode=importlib"]
